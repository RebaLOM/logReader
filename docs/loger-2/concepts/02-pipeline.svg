<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
<rect width="1000" height="620" rx="16" fill="#f4f5f7"/><rect y="0" width="1000" height="72" rx="16" fill="#ffffff"/><g font-family="Segoe UI,Arial" fill="#17202d"><text x="30" y="47" font-size="25" font-weight="700">LOGER / Pipeline</text><text x="858" y="44" font-size="14">☀ Светлая</text><rect x="80" y="100" width="210" height="52" rx="26" fill="#f2c94c"/><text x="105" y="134" font-size="17" font-weight="600">1  Импорт</text><text x="352" y="134" font-size="17" fill="#637083">2  Декодирование</text><text x="610" y="134" font-size="17" fill="#637083">3  Экспорт</text><text x="812" y="134" font-size="17" fill="#637083">4  Проверка</text><rect x="80" y="184" width="840" height="340" rx="16" fill="#ffffff"/><text x="120" y="244" font-size="34" font-weight="600">Начнём с ваших данных</text><text x="120" y="284" font-size="16" fill="#637083">Один лог или целая папка — всё будет подготовлено к обработке.</text><rect x="120" y="321" width="340" height="142" rx="12" fill="#ebeef2"/><rect x="486" y="321" width="394" height="142" rx="12" fill="#ebeef2"/><text x="148" y="365" font-size="25">Один файл</text><text x="148" y="397" font-size="15" fill="#637083">TRC / ASC / CSV / TXT</text><text x="148" y="439" font-size="15">Выбрать файл →</text><text x="514" y="365" font-size="25">Пакет логов</text><text x="514" y="397" font-size="15" fill="#637083">Объединение или разделение по датам</text><text x="514" y="439" font-size="15">Выбрать папку →</text><text x="80" y="572" font-size="14" fill="#637083">Шаг 1 из 4</text><rect x="742" y="550" width="178" height="46" rx="8" fill="#f2c94c"/><text x="790" y="579" font-size="17" font-weight="600">Далее →</text></g></svg>
