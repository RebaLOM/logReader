name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  linux:
    name: Build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (cross-platform projects)
        run: |
          dotnet restore logReader/logReader.csproj
          dotnet restore logReader.Tests/logReader.Tests.csproj

      - name: Build core library
        run: dotnet build logReader/logReader.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test logReader.Tests/logReader.Tests.csproj -c Release

      # logReader.UI targets net10.0-windows (WinForms). It cannot run on Linux,
      # but EnableWindowsTargeting lets us catch compile breaks on the fast runner.
      - name: Compile WinForms UI (Windows-targeted)
        run: dotnet build logReader.UI/logReader.UI.csproj -c Release -p:EnableWindowsTargeting=true

  windows:
    name: Build solution & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Native build of the whole solution, including the WinForms UI.
      - name: Build full solution
        run: dotnet build logReader.slnx -c Release

      - name: Run tests
        run: dotnet test logReader.Tests/logReader.Tests.csproj -c Release
